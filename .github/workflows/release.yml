name: Release wgt

# EXPERIMENTAL, manual only (Actions > Release wgt > Run workflow): build tizen-app/ into a .wgt signed with a throwaway author
# certificate generated on the runner, and attach it to a GitHub Release.
# The package is meant to be RE-SIGNED by the user's installer
# (e.g. Apps2Samsung) with their own Samsung certificate, so the throwaway
# cert is discarded after the build. No TMDB token is ever included.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wgt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Tizen Studio CLI
        run: |
          curl -fsSL -o /tmp/web-cli.bin \
            https://download.tizen.org/sdk/Installer/tizen-studio_5.6/web-cli_Tizen_Studio_5.6_ubuntu-64.bin
          chmod +x /tmp/web-cli.bin
          /tmp/web-cli.bin --accept-license "$HOME/tizen-studio" < /dev/null
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"

      - name: Stage sources (no tools/, no token)
        run: |
          mkdir -p stage/web
          cp -r tizen-app/. stage/web/
          rm -rf stage/web/tools stage/web/js/tmdb-token.js
          VER="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i -E "s/(<widget [^>]*version=\")[^\"]*(\")/\1${VER}\2/" stage/web/config.xml
          fi
          grep -o 'version="[^"]*"' stage/web/config.xml | head -1

      - name: Build and package with a throwaway author certificate
        run: |
          trap 'echo "--- tizen cli.log ---"; tail -n 80 "$HOME"/tizen-studio-data/cli/logs/cli.log 2>/dev/null || find "$HOME" -name cli.log -exec tail -n 80 {} \;' ERR
          CERT_PW="$(openssl rand -hex 12)"
          tizen certificate -a 30nama-community -p "$CERT_PW" -f throwaway -- "$PWD/stage"
          # The Linux CLI stores profile passwords in an encrypted form it then rejects
          # ("Invaild password"), so write profiles.xml with plaintext passwords instead.
          DIST="$HOME/tizen-studio/tools/certificate-generator/certificates/distributor"
          mkdir -p "$HOME/tizen-studio-data/profile"
          cat > "$HOME/tizen-studio-data/profile/profiles.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="ci" version="3.1">
          <profile name="ci">
          <profileitem ca="" distributor="0" key="$PWD/stage/throwaway.p12" password="" rootca=""/>
          <profileitem ca="$DIST/tizen-distributor-ca.cer" distributor="1" key="$DIST/tizen-distributor-signer.p12" password="tizenpkcs12passfordsigner" rootca=""/>
          <profileitem ca="" distributor="2" key="" password="" rootca=""/>
          </profile>
          </profiles>
          EOF
          sed -i 's/^ *//' "$HOME/tizen-studio-data/profile/profiles.xml"
          tizen cli-config "profiles.path=$HOME/tizen-studio-data/profile/profiles.xml"
          tizen build-web -out "$PWD/stage/out" -- "$PWD/stage/web"
          mkdir -p dist
          { sleep 4; echo "$CERT_PW"; sleep 2; echo tizenpkcs12passfordsigner; sleep 2; } | script -qec "tizen package -t wgt -s ci -o $PWD/dist -- $PWD/stage/out" /dev/null
          ls -l dist
          rm -f stage/throwaway.p12

      - name: Verify package contents
        run: |
          WGT="$(ls dist/*.wgt | head -1)"
          unzip -l "$WGT"
          if unzip -l "$WGT" | grep -E 'tmdb-token\.js|/tools/|\.p12|\.pwd'; then echo "forbidden file in wgt"; exit 1; fi
          unzip -p "$WGT" 'js/*' config.xml index.html | grep -q 'eyJ' && { echo "JWT-like string in wgt"; exit 1; } || true
          unzip -l "$WGT" | grep -q author-signature.xml
          unzip -l "$WGT" | grep -q signature1.xml
          mv "$WGT" "dist/30nama-${GITHUB_REF_NAME}.wgt"

      - uses: actions/upload-artifact@v4
        with:
          name: 30nama-wgt
          path: dist/*.wgt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.wgt
          generate_release_notes: true
          body: |
            Prebuilt `.wgt` for Samsung Tizen TVs. It is NOT signed for your TV:
            install it with an installer that re-signs with your own certificate
            (see the README, Option 2). Also installable as a TizenBrew module.
