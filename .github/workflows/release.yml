name: Release

# Opt-in: a merge to main only releases if the merged PR has a release label
# (release:patch | release:minor | release:major). No label = no release.
#   1. picks the bump from the merged PR's label
#   2. bumps the version in tizen-app/config.xml and package.json, commits, tags vX.Y.Z
#   3. builds the .wgt and publishes a GitHub Release with generated notes
# Can also be run by hand (Actions > Release > Run workflow) to cut a release of a chosen size.
#
# The .wgt is signed with a throwaway author certificate generated on the runner and is meant to be
# RE-SIGNED by the user's installer (e.g. Apps2Samsung). No TMDB token is ever included.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: read

# One release at a time; never cancel a release that is half way through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Skip the bot's own version commit so a release never triggers another release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-22.04
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide bump type
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "kind=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LABELS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name' || true)"
          echo "PR labels: ${LABELS:-<none>}"
          if grep -qx 'release:major' <<<"$LABELS"; then kind=major
          elif grep -qx 'release:minor' <<<"$LABELS"; then kind=minor
          elif grep -qx 'release:patch' <<<"$LABELS"; then kind=patch
          else kind=skip; fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Bump version, commit and tag
        id: bump
        if: steps.kind.outputs.kind != 'skip'
        run: |
          # Latest released version = highest v* tag; fall back to config.xml for a first release.
          LAST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          LAST="${LAST#v}"
          [[ -n "$LAST" ]] || LAST="$(perl -0ne 'print $1 if /<widget\b[^>]*?\bversion="([^"]+)"/' tizen-app/config.xml)"
          IFS=. read -r MA MI PA <<<"$LAST"
          case "${{ steps.kind.outputs.kind }}" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            *)     PA=$((PA+1)) ;;
          esac
          NEW="$MA.$MI.$PA"
          echo "$LAST -> $NEW"

          # the <widget> tag spans several lines, so edit it in slurp mode
          perl -0pi -e "s/(<widget\b[^>]*?\bversion=\")[^\"]*(\")/\${1}${NEW}\$2/" tizen-app/config.xml
          sed -i -E "0,/\"version\": *\"[^\"]*\"/s//\"version\": \"${NEW}\"/" package.json
          perl -0ne 'exit(/<widget\b[^>]*?\bversion="'"$NEW"'"/ ? 0 : 1)' tizen-app/config.xml
          grep -q "\"version\": \"$NEW\"" package.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tizen-app/config.xml package.json
          git commit -m "chore(release): v${NEW} [skip ci]"
          git tag -a "v${NEW}" -m "v${NEW}"
          git push origin HEAD:main "v${NEW}"

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

  wgt:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-22.04
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Tizen Studio CLI
        run: |
          curl -fsSL -o /tmp/web-cli.bin \
            https://download.tizen.org/sdk/Installer/tizen-studio_5.6/web-cli_Tizen_Studio_5.6_ubuntu-64.bin
          chmod +x /tmp/web-cli.bin
          /tmp/web-cli.bin --accept-license "$HOME/tizen-studio" < /dev/null
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"

      - name: Stage sources (no tools/, no token)
        run: |
          mkdir -p stage/web
          cp -r tizen-app/. stage/web/
          rm -rf stage/web/tools stage/web/js/tmdb-token.js stage/web/js/dev-session.js
          grep -o 'version="[^"]*"' stage/web/config.xml | head -1

      - name: Build and package with a throwaway author certificate
        run: |
          trap 'echo "--- tizen cli.log ---"; tail -n 80 "$HOME"/tizen-studio-data/cli/logs/cli.log 2>/dev/null || find "$HOME" -name cli.log -exec tail -n 80 {} \;' ERR
          CERT_PW="$(openssl rand -hex 12)"
          tizen certificate -a 30nama-community -p "$CERT_PW" -f throwaway -- "$PWD/stage"
          # The Linux CLI stores profile passwords in an encrypted form it then rejects
          # ("Invaild password"), so write profiles.xml with plaintext passwords instead.
          DIST="$HOME/tizen-studio/tools/certificate-generator/certificates/distributor"
          mkdir -p "$HOME/tizen-studio-data/profile"
          cat > "$HOME/tizen-studio-data/profile/profiles.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="ci" version="3.1">
          <profile name="ci">
          <profileitem ca="" distributor="0" key="$PWD/stage/throwaway.p12" password="" rootca=""/>
          <profileitem ca="$DIST/tizen-distributor-ca.cer" distributor="1" key="$DIST/tizen-distributor-signer.p12" password="tizenpkcs12passfordsigner" rootca=""/>
          <profileitem ca="" distributor="2" key="" password="" rootca=""/>
          </profile>
          </profiles>
          EOF
          sed -i 's/^ *//' "$HOME/tizen-studio-data/profile/profiles.xml"
          tizen cli-config "profiles.path=$HOME/tizen-studio-data/profile/profiles.xml"
          tizen build-web -out "$PWD/stage/out" -- "$PWD/stage/web"
          mkdir -p dist
          { sleep 4; echo "$CERT_PW"; sleep 2; echo tizenpkcs12passfordsigner; sleep 2; } | script -qec "tizen package -t wgt -s ci -o $PWD/dist -- $PWD/stage/out" /dev/null
          ls -l dist
          rm -f stage/throwaway.p12

      - name: Verify package contents
        run: |
          WGT="$(ls dist/*.wgt | head -1)"
          unzip -l "$WGT"
          if unzip -l "$WGT" | grep -E 'tmdb-token\.js|/tools/|\.p12|\.pwd'; then echo "forbidden file in wgt"; exit 1; fi
          unzip -p "$WGT" 'js/*' config.xml index.html | grep -q 'eyJ' && { echo "JWT-like string in wgt"; exit 1; } || true
          unzip -l "$WGT" | grep -q author-signature.xml
          unzip -l "$WGT" | grep -q signature1.xml
          mv "$WGT" "dist/30nama-${TAG}.wgt"

      - uses: actions/upload-artifact@v4
        with:
          name: 30nama-wgt
          path: dist/*.wgt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.wgt
          generate_release_notes: true
          body: |
            Prebuilt `.wgt` for Samsung Tizen TVs. It is NOT signed for your TV:
            install it with an installer that re-signs with your own certificate
            (see the README, Option 2). Also installable as a TizenBrew module.
